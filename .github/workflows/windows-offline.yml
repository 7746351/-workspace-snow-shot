name: Windows Offline Build

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      SNOW_SHOT_OFFLINE: 'ON'
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Qt 6.12.0
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: D:\Qt\6.12.0\msvc2022_64
          key: qt-6.12.0-msvc2022_64-v1

      - name: Provision Qt 6.12.0
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64'
          $xmlPath = Join-Path $env:RUNNER_TEMP 'qt-updates.xml'
          curl.exe -sSL --retry 3 --retry-delay 5 -o $xmlPath "$repo/Updates.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download Qt metadata.' }
          [xml]$xml = Get-Content -LiteralPath $xmlPath
          $target = 'D:\Qt\6.12.0\msvc2022_64'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $packages = @(
            'qt.qt6.6120.win64_msvc2022_64',
            'qt.qt6.6120.addons.qt5compat.win64_msvc2022_64'
          )
          foreach ($name in $packages) {
            $package = $xml.Updates.PackageUpdate | Where-Object { $_.Name -eq $name }
            if (-not $package) { throw "Qt package $name not found in repository metadata." }
            foreach ($archive in ($package.DownloadableArchives -split ',')) {
              $archive = $archive.Trim()
              if (-not $archive) { continue }
              $url = "$repo/$name/$($package.Version)$archive"
              $destination = Join-Path $env:RUNNER_TEMP $archive
              Write-Host "Downloading $archive"
              curl.exe -sSL --retry 3 --retry-delay 5 -o $destination $url
              if ($LASTEXITCODE -ne 0) { throw "Failed to download $url" }
              $extractRoot = $target
              if ($archive -like 'd3dcompiler*' -or $archive -like 'opengl32sw*') {
                $extractRoot = Join-Path $target 'bin'
              }
              & 7z x -y "-o$extractRoot" $destination | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Failed to extract $archive" }
            }
          }

      - name: Select Qt 6.12.0
        shell: pwsh
        run: |
          "QTDIR=D:\Qt\6.12.0\msvc2022_64" >> $env:GITHUB_ENV
          "Qt6_DIR=D:\Qt\6.12.0\msvc2022_64\lib\cmake\Qt6" >> $env:GITHUB_ENV
          "D:\Qt\6.12.0\msvc2022_64\bin" >> $env:GITHUB_PATH

      - name: Add Qt 6.12 Release import configs
        shell: pwsh
        run: |
          $root = 'D:\Qt\6.12.0\msvc2022_64\lib\cmake'
          Get-ChildItem -Path $root -Recurse -Filter '*Targets-relwithdebinfo.cmake' |
            ForEach-Object {
              $content = Get-Content -LiteralPath $_.FullName -Raw
              $content = $content -replace 'RelWithDebInfo', 'Release' -replace 'RELWITHDEBINFO', 'RELEASE'
              $releasePath = $_.FullName -replace '-relwithdebinfo\.cmake$', '-release.cmake'
              Set-Content -LiteralPath $releasePath -Value $content -NoNewline
            }

      - name: Cache vcpkg and dependencies
        uses: actions/cache@v4
        with:
          path: |
            .tools/vcpkg
            .vcpkg-cache
            build/windows-msvc-performance
          key: snow-offline-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}
          restore-keys: |
            snow-offline-${{ runner.os }}-

      - name: Prepare vcpkg tool
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -Preset windows-msvc-performance -SkipDependencyInstall

      - name: Seed OpenCV patch download
        shell: pwsh
        run: |
          $downloads = Join-Path $PWD '.tools/vcpkg/downloads'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          $name = '468de9b36740b3355f0d5cd8be2ce28b340df120.patch'
          $expected = '09ee552fcd9a96359230104d7bf8610a63e05d743a3b51d58c6469331729a6440444e05c616464380dbebaefdd7ee6fb06cac5fc70694af85f9c8d40201aad10'
          $destination = Join-Path $downloads "$expected-$name"
          if (-not (Test-Path -LiteralPath $destination)) {
            $url = "https://github.com/opencv/opencv/commit/$name?full_index=1"
            curl.exe -sSL --retry 10 --retry-all-errors --retry-delay 10 -o $destination $url
            if ($LASTEXITCODE -ne 0 -or
                -not (Test-Path -LiteralPath $destination) -or
                (Get-FileHash -Algorithm SHA512 -LiteralPath $destination).Hash.ToLower() -ne $expected) {
              Remove-Item -LiteralPath $destination -Force -ErrorAction SilentlyContinue
              Write-Warning 'Unable to seed the OpenCV patch; vcpkg will download it.'
            }
          }

      - name: Bootstrap vcpkg dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VCPKG_BINARY_SOURCES = "clear;files,$PWD\.vcpkg-cache,readwrite"
          $delays = @(15, 30, 60, 120, 240)
          for ($attempt = 1; $attempt -le $delays.Count + 1; $attempt++) {
            try {
              & ./scripts/bootstrap.ps1 -Preset windows-msvc-performance -VcpkgVariants Dynamic
              if ($LASTEXITCODE -eq 0) { exit 0 }
              throw "bootstrap exited with $LASTEXITCODE"
            } catch {
              Write-Warning "Bootstrap attempt $attempt failed: $_"
              if ($attempt -gt $delays.Count) { throw }
              $seconds = $delays[$attempt - 1]
              Write-Host "Retrying in $seconds seconds."
              Start-Sleep -Seconds $seconds
            }
          }

      - name: Save vcpkg dependency cache
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/vcpkg
            .vcpkg-cache
          key: snow-offline-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}-${{ github.run_id }}

      - name: Configure offline Mini
        shell: pwsh
        run: |
          cmake --preset windows-msvc-performance `
            -DSNOW_SHOT_OFFLINE=ON `
            -DSNOW_APPS_BUILD_TESTS=OFF `
            -DSNOW_APPS_BUILD_BENCHMARKS=OFF `
            -DSNOW_APPS_BUILD_IMAGE_VIEWER=OFF `
            -DSNOW_APPS_BUILD_DRAW_ENGINE_DEMO=OFF

      - name: Build Snow Shot Offline
        shell: pwsh
        run: |
          cmake --build build/windows-msvc-performance --config Release `
            --target snow_shot_mini --parallel

      - name: Collect third-party licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $PWD 'build/windows-msvc-performance'
          $qtRoot = 'D:\Qt\6.12.0\msvc2022_64'
          $qtAudit = Join-Path $qtRoot 'share/snow-apps/qt-licenses/qt'
          $qtLicenses = Join-Path $qtRoot 'LICENSES'
          if (-not (Test-Path -LiteralPath $qtLicenses)) {
            throw "The Qt kit has no LICENSES directory: $qtLicenses"
          }
          New-Item -ItemType Directory -Force -Path $qtAudit | Out-Null
          Copy-Item -Path (Join-Path $qtLicenses '*') -Destination $qtAudit -Recurse -Force
          & ./scripts/collect-third-party-licenses.ps1 `
            -Destination (Join-Path $build 'snow_shot/third-party-licenses/third-party') `
            -AllowedRoot $build `
            -VcpkgPrefix (Join-Path $PWD '.tools/vcpkg/installed/dynamic/x64-windows') `
            -QtPrefix $qtRoot `
            -CargoManifest (Join-Path $PWD 'snow_rust_ffi/Cargo.toml') `
            -AntDesignNotice (Join-Path $PWD 'ant_design_qt/THIRD_PARTY_NOTICES.md') `
            -FallbackLicenseDirectory (Join-Path $PWD 'licenses')
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed.' }

      - name: Stage portable package
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifacts/snow-shot-offline'
          $install = Join-Path $stage 'stage'
          if (Test-Path $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          cmake --install build/windows-msvc-performance --config Release `
            --component SnowShotMini --prefix $install
          if ($LASTEXITCODE -ne 0) { throw 'Install failed.' }
          New-Item -ItemType File -Path (Join-Path $install 'bin/__mini_data_directory') -Force | Out-Null
          $package = Join-Path $stage 'SnowShotOffline'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -Path (Join-Path $install '*') -Destination $package -Recurse -Force
          Compress-Archive -Path $package -DestinationPath (Join-Path $stage 'snow-shot-offline-windows-x64.zip') -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-offline-windows-x64
          path: artifacts/snow-shot-offline/snow-shot-offline-windows-x64.zip
          if-no-files-found: error
